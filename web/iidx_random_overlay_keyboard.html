<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>IIDX RANDOM Keyboard Overlay v1.1</title>
<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent;
}
body{font-family:Arial,"Noto Sans JP",sans-serif}
#wrap{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
}
#panel{
  display:none;
  align-items:center;
  padding:12px 14px;
  border-radius:12px;
  background:rgba(0,0,0,.62);
  box-sizing:border-box;
}
#keys{
  display:flex;
  gap:6px;
  align-items:center;
}
.key{
  width:58px;
  height:72px;
  display:flex;
  align-items:center;
  justify-content:center;
  box-sizing:border-box;
  border:2px solid rgba(255,255,255,.95);
  border-radius:6px;
  font-size:40px;
  font-weight:800;
  line-height:1;
  text-shadow:0 1px 2px rgba(0,0,0,.45);
}
.white-key{
  background:rgba(245,245,245,.96);
  color:#111;
  border-color:#fff;
  text-shadow:none;
}
.black-key{
  background:rgba(15,15,18,.96);
  color:#fff;
  border-color:rgba(235,235,235,.95);
}
</style>
</head>
<body>
<div id="wrap">
  <div id="panel">
    <div id="keys"></div>
  </div>
</div>

<script>
const panel = document.getElementById("panel");
const keys = document.getElementById("keys");

function render(){
  const s = window.IIDX_RANDOM_STATE || {confirmed:false, layout:""};

  if(!s.confirmed || !/^[1-7]{7}$/.test(s.layout || "")){
    panel.style.display = "none";
    keys.innerHTML = "";
    return;
  }

  keys.innerHTML = "";

  for(const n of s.layout){
    const d = document.createElement("div");
    const isWhite = Number(n) % 2 === 1;
    d.className = "key " + (isWhite ? "white-key" : "black-key");
    d.textContent = n;
    keys.appendChild(d);
  }

  panel.style.display = "flex";
}

function reloadState(){
  const old = document.getElementById("state-script");
  if(old) old.remove();

  const sc = document.createElement("script");
  sc.id = "state-script";
  sc.src = "iidx_random_state.js?t=" + Date.now();
  sc.onload = render;
  document.body.appendChild(sc);
}

reloadState();
setInterval(reloadState, 200);
</script>
</body>
</html>
